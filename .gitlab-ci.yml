# Runs on every push and merge request. Definition of Done = this pipeline is green.
default:
  image: node:22
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store

stages:
  - verify
  - test
  - publish

lint:
  stage: verify
  script:
    - pnpm lint

typecheck:
  stage: verify
  script:
    - pnpm typecheck

test:
  stage: test
  script:
    - pnpm test
  artifacts:
    when: always
    paths:
      - '**/coverage/'
    reports:
      junit: '**/reports/junit-*.xml'

# Builds the API image (apps/api/Dockerfile) on every branch, so a broken image fails the merge
# request. On main it also pushes the image to Docker Hub, tagged with the commit and "main"
# (DL-014, DL-015). Kaniko builds without a Docker daemon, so the runner needs no privileged mode.
# Deploying that image to Azure is a separate command for now (README, "Deploy to staging").
api-image:
  stage: publish
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: ['']
  before_script: []
  cache: []
  script:
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        mkdir -p /kaniko/.docker
        AUTH=$(printf '%s:%s' "$DOCKERHUB_USERNAME" "$DOCKERHUB_TOKEN" | base64 | tr -d '\n')
        printf '{"auths":{"https://index.docker.io/v1/":{"auth":"%s"}}}' "$AUTH" > /kaniko/.docker/config.json
        /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile "$CI_PROJECT_DIR/apps/api/Dockerfile" \
          --destination "docker.io/$DOCKERHUB_USERNAME/loadwise-api:$CI_COMMIT_SHORT_SHA" \
          --destination "docker.io/$DOCKERHUB_USERNAME/loadwise-api:main"
        echo "Pushed loadwise-api:$CI_COMMIT_SHORT_SHA. Deploy it with the command in the README."
      else
        /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile "$CI_PROJECT_DIR/apps/api/Dockerfile" --no-push
      fi
  # Only build when a file that goes into the image changed (see .dockerignore), so pushes that touch
  # only docs or the mobile app skip about 4 minutes of Kaniko (Sprint 2 retro action, NFR 5).
  rules:
    - if: $CI_COMMIT_BRANCH
      changes:
        - apps/api/**/*
        - packages/**/*
        - apps/mobile/package.json
        - '{package.json,pnpm-lock.yaml,pnpm-workspace.yaml,turbo.json,tsconfig*.json,.dockerignore,.gitlab-ci.yml}'
